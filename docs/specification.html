<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>技術仕様書 | Sakana Insight</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Mermaid.js for diagrams -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-surface: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --border-color: #e2e8f0;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --code-bg: #f1f5f9;
            --table-header: #f8fafc;
        }

        [data-theme="dark"] {
            --bg-primary: #0b0f19;
            --bg-surface: #111827;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --border-color: #1f2937;
            --primary: #3b82f6;
            --primary-hover: #60a5fa;
            --code-bg: #1e293b;
            --table-header: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.7;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            background: var(--bg-surface);
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--primary-hover);
        }

        .theme-toggle-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.5rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
        }

        .theme-toggle-btn:hover {
            color: var(--text-primary);
            border-color: var(--text-secondary);
        }

        /* Markdown Styles */
        h1, h2, h3, h4 {
            color: var(--text-primary);
            font-weight: 700;
            margin-top: 2rem;
            margin-bottom: 1rem;
            line-height: 1.3;
        }

        h1 {
            font-size: 2rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.8rem;
            margin-top: 0;
        }

        h2 {
            font-size: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
            margin-top: 2.5rem;
        }

        h3 {
            font-size: 1.25rem;
            margin-top: 1.8rem;
        }

        p {
            margin-bottom: 1.2rem;
            color: var(--text-secondary);
        }

        ul, ol {
            margin-bottom: 1.2rem;
            padding-left: 1.5rem;
            color: var(--text-secondary);
        }

        li {
            margin-bottom: 0.4rem;
        }

        hr {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 2.5rem 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 0.75rem 1rem;
            text-align: left;
        }

        th {
            background-color: var(--table-header);
            font-weight: 600;
            color: var(--text-primary);
        }

        code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            background-color: var(--code-bg);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-size: 0.875em;
            color: var(--text-primary);
        }

        pre {
            background-color: var(--code-bg);
            padding: 1.2rem;
            border-radius: 8px;
            overflow-x: auto;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border-color);
        }

        pre code {
            background-color: transparent;
            padding: 0;
            font-size: 0.875rem;
        }

        blockquote {
            border-left: 4px solid var(--primary);
            padding: 0.75rem 1rem;
            margin: 1.5rem 0;
            background: var(--code-bg);
            border-radius: 0 6px 6px 0;
            color: var(--text-secondary);
        }

        .mermaid {
            display: flex;
            justify-content: center;
            margin: 2rem 0;
            background: #ffffff;
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        [data-theme="dark"] .mermaid {
            background: #1e293b;
        }

        #loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem 0.5rem;
            }
            .container {
                padding: 1.5rem;
            }
            h1 {
                font-size: 1.5rem;
            }
            h2 {
                font-size: 1.25rem;
            }
            table {
                display: block;
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header-bar">
            <a href="./index.html" class="back-link">
                <i class="fa-solid fa-arrow-left"></i> ダッシュボードへ戻る
            </a>
            <button id="theme-btn" class="theme-toggle-btn">
                <i class="fa-solid fa-moon"></i> テーマ切替
            </button>
        </header>

        <div id="content">
            <div id="loading">
                <i class="fa-solid fa-spinner fa-spin"></i> 仕様書を読み込み中...
            </div>
        </div>
    </div>

    <script>
        // テーマ初期化
        const currentTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', currentTheme);
        updateThemeBtn(currentTheme);

        document.getElementById('theme-btn').addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateThemeBtn(next);
            // Mermaid 再描画
            mermaid.initialize({ startOnLoad: true, theme: next === 'dark' ? 'dark' : 'default' });
            mermaid.run();
        });

        function updateThemeBtn(theme) {
            const btn = document.getElementById('theme-btn');
            btn.innerHTML = `<i class="fa-solid ${theme === 'dark' ? 'fa-sun' : 'fa-moon'}"></i> ${theme === 'dark' ? 'ライト' : 'ダーク'}`;
        }

        // Mermaid 初期設定
        mermaid.initialize({
            startOnLoad: false,
            theme: currentTheme === 'dark' ? 'dark' : 'default',
            securityLevel: 'loose'
        });

        // カスタムレンダラーで mermaid コードブロックを .mermaid に置換
        const renderer = new marked.Renderer();
        const defaultCodeRenderer = renderer.code.bind(renderer);
        renderer.code = function(code, language) {
            if (language === 'mermaid') {
                return `<div class="mermaid">${code}</div>`;
            }
            return defaultCodeRenderer(code, language);
        };
        marked.setOptions({ renderer });

        // specification.md の読み込みとレンダリング
        async function loadDoc() {
            try {
                const res = await fetch('./specification.md');
                if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                const text = await res.text();
                document.getElementById('content').innerHTML = marked.parse(text);
                await mermaid.run({
                    nodes: document.querySelectorAll('.mermaid')
                });
            } catch (err) {
                console.error(err);
                document.getElementById('content').innerHTML = `
                    <div style="color: #ef4444; padding: 2rem; border: 1px solid #fca5a5; border-radius: 8px; background: #fef2f2;">
                        <h3>仕様書の読み込みに失敗しました</h3>
                        <p>ファイルを読み込めませんでした。ローカルサーバー経由または GitHub Pages 上でアクセスしてください。</p>
                        <p><a href="./index.html">ダッシュボードへ戻る</a></p>
                    </div>
                `;
            }
        }

        loadDoc();
    </script>
</body>
</html>
